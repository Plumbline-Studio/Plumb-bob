<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lantern Supply Co. — Order confirmed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Order confirmed</h1></header>
  <main>
    <p id="summary"></p>
    <p id="thanks"></p>
    <a href="index.html" id="done">Done</a>
  </main>
  <script>
    const PRICES = {
      classic: { name: "Lantern Classic", price: 29 },
      pro: { name: "Lantern Pro", price: 49 },
    };
    const p = new URLSearchParams(location.search);
    const item = PRICES[p.get("item")] ? p.get("item") : "classic";
    const qty = Math.max(1, Number(p.get("qty")) || 1);
    const total = (PRICES[item].price * qty).toFixed(2);
    document.getElementById("summary").textContent =
      `${qty} × ${PRICES[item].name} — Total: $${total}`;
    document.getElementById("thanks").textContent =
      `Thanks, ${p.get("name") || "Guest"}! Your lanterns ship within 2 business days.`;
  </script>
</body>
</html>
