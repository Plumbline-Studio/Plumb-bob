# Engine repo CI: typecheck + offline test tier + deterministic harness.
# No API key needed — the mock tier drives a real chromium against local
# fixtures, so browsers ARE installed here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test (offline tier)
        run: npm run test

      - name: Eval harness (deterministic mock tier)
        run: npm run harness

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report
          path: harness/out/eval-report.*
          if-no-files-found: ignore
