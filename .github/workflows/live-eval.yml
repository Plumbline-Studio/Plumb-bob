# Live eval harness: real model calls, run on demand and weekly. Costs money,
# so it never runs per-PR, and it skips gracefully (green, with a notice)
# on forks or repos where the ANTHROPIC_API_KEY secret is absent.
name: Live Eval

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — a weekly drift check on real model behavior.
    - cron: "0 6 * * 1"

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run live harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUMB_BOB_EVAL_TIER: live
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not configured — skipping live eval"
            exit 0
          fi
          npm run harness

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report
          path: |
            harness/out/
          if-no-files-found: ignore

      # KPI capture: append one provenance-stamped line to the eval-history
      # data branch. Runs even when the harness fails — a failed run is a
      # data point, not a gap.
      - name: Append eval history
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f harness/out/eval-report.json ]; then
            echo "::notice::no eval report — nothing to append"
            exit 0
          fi
          git clone --depth 1 --branch eval-history \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/hist
          node harness/append-history.mjs /tmp/hist/evals/history.jsonl
          cd /tmp/hist
          git config user.name "plumb-bob-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/history.jsonl
          git commit -m "eval: run ${GITHUB_RUN_ID}" || exit 0
          git push
